    <div class="container mt-5">
        <h2>Products</h2>

        <table class="table table-bordered">
            <thead>
                <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
            </thead>

            <tbody id="productTable"></tbody>
        </table>

        <button class="btn btn-primary" onclick="loadProducts()">Load Products</button>
    </div>

    <script>
        //Function for new products
        function Product(name, price, quantity) {
            this.name = name;
            this.price = price;
            this.quantity = quantity;
        }

        let products = [
        new Product("Laptop", 500, 10),
        new Product("Phone", 300, 20)
        ];

        //Fonction to show products when clicking the button
        function loadProducts() {
            let table = document.getElementById("productTable");
            table.innerHTML = "";
    
            products.forEach(p => {
                table.innerHTML += `<tr>
                <td>${p.name}</td>
                <td>${p.price}</td>
                <td>${p.quantity}</td>
                </tr>`;
            });
        }
    </script>

    <div class="bg-dark text-white mt-5 p-2">
        <marquee id="bannerText"></marquee>
    </div>

    <footer class="bg-light text-center p-3 mt-4">
        <p>© 2026 Inventory Management System</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>

    // Function to update banner with date and time
    function updateBanner() {
        let now = new Date();

        let date = now.toLocaleDateString();
        let time = now.toLocaleTimeString();

        document.getElementById("bannerText").innerText =
            "Welcome to Inventory System! Today is " + date + " and time is " + time;
    }

    // Update every second
    setInterval(updateBanner, 1000);

    </script>
