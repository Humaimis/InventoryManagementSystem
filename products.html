                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

        </div>

    <div class="container mt-5">
        <h2>Products</h2>

        <div class="mb-3">
            <input id="name" class="form-control mb-2" placeholder="Product Name">
            <input id="price" class="form-control mb-2" placeholder="Price">
            <input id="qty" class="form-control mb-2" placeholder="Quantity">

            <button class="btn btn-success" onclick="addProduct()">Add Product</button>
        </div>

        <input id="search" class="form-control mb-3" placeholder="Search..." onkeyup="searchProduct()">

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                </tr>
            </thead>
            <tbody id="productTable"></tbody>
        </table>

    </div>

    <div class="bg-dark text-white mt-5 p-2">
         <marquee id="bannerText"></marquee>
    </div>

     <footer class="bg-light text-center p-3 mt-4">
        <p>© 2026 Inventory Management System</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>

        // Constructor
         function Product(name, price, quantity) {
              this.name = name;
              this.price = price;
              this.quantity = quantity;
         }

         // Array
          let products = [
             new Product("Laptop", 500, 10),
             new Product("Phone", 300, 20)
        ];

        // Display
        function displayProducts(list) {
             let table = document.getElementById("productTable");
             table.innerHTML = "";

             list.forEach(p => {
                 table.innerHTML += `
                     <tr>
                          <td>${p.name}</td>
                          <td>${p.price}</td>
                          <td>${p.quantity}</td>
                     </tr>`;
             });
          }

         // Add new products 
         function addProduct() {
             let name = document.getElementById("name").value;
             let price = parseFloat(document.getElementById("price").value);
             let qty = parseInt(document.getElementById("qty").value);

             if (!name || isNaN(price) || isNaN(qty)) {
                alert("Enter valid data");
                 return;
             }

             products.push(new Product(name, price, qty));
             displayProducts(products);
         }

        // Search
         function searchProduct() {
            let keyword = document.getElementById("search").value.toLowerCase();

             let filtered = products.filter(p =>
                 p.name.toLowerCase().includes(keyword)
            );

            displayProducts(filtered);
        }
            
        // Banner
        setInterval(() => {
             let now = new Date();
             document.getElementById("bannerText").innerText =
                "Welcome! " + now.toLocaleDateString() + " " + now.toLocaleTimeString();
        }, 1000);

        // Initial load
        displayProducts(products);

    </script>
    
</body>
