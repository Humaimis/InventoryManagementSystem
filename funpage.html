<div class="container mt-5 text-center">
    <h2>Guess the Inventory Number</h2>
    <p>Guess a number between 1 and 20</p>

    <input type="number" id="guess" class="form-control w-25 mx-auto">
    <button class="btn btn-primary mt-3" onclick="checkGuess()">Guess</button>

    <h4 class="mt-4" id="result"></h4>
</div>

<div class="bg-dark text-white mt-5 p-2">
    <marquee id="bannerText"></marquee>
</div>

<footer class="bg-light text-center p-3 mt-4">
    <p>© 2026 Inventory Management System</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Random number
let number = Math.floor(Math.random() * 20) + 1;

function checkGuess() {
    let guess = document.getElementById("guess").value;

    if (guess == number) {
        document.getElementById("result").innerText = "Correct!";
    } else if (guess > number) {
        document.getElementById("result").innerText = "Too high!";
    } else {
        document.getElementById("result").innerText = "Too low!";
    }
}

// Banner
setInterval(() => {
    let now = new Date();
    document.getElementById("bannerText").innerText =
    "Welcome! " + now.toLocaleDateString() + " " + now.toLocaleTimeString();
}, 1000);
    
</script>
