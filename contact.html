<div class="container mt-5">
    <h2>Contact Us</h2>

    <!-- Form sends data to process_contact.php (Part 3 requirement) -->
    <form action="php/process_contact.php" method="post" onsubmit="return validateContactForm()">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" id="name" name="name" class="form-control">
            <span id="nameError" style="color:red;"></span>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" id="email" name="email" class="form-control">
            <span id="emailError" style="color:red;"></span>
        </div>

        <div class="mb-3">
            <label class="form-label">Subject</label>
            <input type="text" id="subject" name="subject" class="form-control">
            <span id="subjectError" style="color:red;"></span>
        </div>

        <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea id="message" name="message" class="form-control"></textarea>
            <span id="messageError" style="color:red;"></span>
        </div>

        <button type="submit" class="btn btn-primary">Send Message</button>

    </form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

// JavaScript validation function for Contact Form (Part 1)
function validateContactForm() {

    // Clear previous error messages
    document.getElementById("nameError").innerText    = "";
    document.getElementById("emailError").innerText   = "";
    document.getElementById("subjectError").innerText = "";
    document.getElementById("messageError").innerText = "";

    var isValid = true;

    // (a) Required field + (c) Length check: Name must be at least 3 characters
    var name = document.getElementById("name").value.trim();
    if (name.length < 3) {
        document.getElementById("nameError").innerText = "Name must be at least 3 characters.";
        isValid = false;
    }

    // (b) Regular expression validation: Email format check
    var email = document.getElementById("email").value.trim();
    var emailPattern = /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i;
    if (!emailPattern.test(email)) {
        document.getElementById("emailError").innerText = "Please enter a valid email address.";
        isValid = false;
    }

    // (a) Required field check: Subject must not be empty
    var subject = document.getElementById("subject").value.trim();
    if (subject === "") {
        document.getElementById("subjectError").innerText = "Subject is required.";
        isValid = false;
    }

    // (c) Length constraint: Message must be at least 10 characters
    var message = document.getElementById("message").value.trim();
    if (message.length < 10) {
        document.getElementById("messageError").innerText = "Message must be at least 10 characters.";
        isValid = false;
    }

    return isValid;
}

// Banner
function updateBanner() {
    var now = new Date();
    document.getElementById("bannerText").innerText =
        "Welcome to Inventory System! Today is " + now.toLocaleDateString() +
        " and time is " + now.toLocaleTimeString();
}
setInterval(updateBanner, 1000);

</script>
