    <div class="container mt-5">
        <h2>Contact Us</h2>

        <form onsubmit="return validateContactForm()">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" id="email" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Subject</label>
                <input type="text" id="subject" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea id="message" class="form-control"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Send Message</button>

        </form>
    </div>

    <div class="bg-dark text-white mt-5 p-2"> 
        <marquee id="bannerText"></marquee> 
    </div> 
 
    <footer class="bg-light text-center p-3 mt-4"> 
        <p>© 2026 Inventory Management System</p> 
    </footer> 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> 
    <script>
        function validateContactForm() {

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let message = document.getElementById("message").value;

            // Name validation
            if (name.length < 3) {
                alert("Name must be at least 3 characters");
                return false;
            }

            // Email validation (regex)
            let pattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            if (!email.match(pattern)) {
                alert("Invalid email format");
                return false;
            }

            // Message validation
            if (message.length < 10) {
                alert("Message must be at least 10 characters");
                return false;
            }

            alert("Message sent successfully!");
            return true;
        }
        
        // Function to update banner with date and time 
        function updateBanner() { 
            let now = new Date(); 
 
             let date = now.toLocaleDateString(); 
             let time = now.toLocaleTimeString(); 
 
             document.getElementById("bannerText").innerText = 
                 "Welcome to Inventory System! Today is " + date + " and time is " + time; 
        } 
 
        // Update every second 
        setInterval(updateBanner, 1000); 
    </script>
