<div class="container mt-5">
    <h2 class="text-center mb-4">Inventory Bill Calculator</h2>

    <div class="p-4 bg-light rounded shadow">

        <div class="mb-3">
            <label class="form-label">Price per item</label>
            <input type="number" id="price" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number" id="quantity" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Customer Age</label>
            <input type="number" id="age" class="form-control">
        </div>

        <button class="btn btn-success" onclick="calculateTotal()">Calculate</button>

        <h4 class="mt-4">Total: <span id="result">0</span></h4>
    </div>
</div>

<div class="bg-dark text-white mt-5 p-2">
    <marquee id="bannerText"></marquee>
</div>

<footer class="bg-light text-center p-3">
    <p>© 2026 Inventory Management System</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Banner
function updateBanner() {
    let now = new Date();
    document.getElementById("bannerText").innerText =
        "Welcome! Today is " + now.toLocaleDateString() +
        " and time is " + now.toLocaleTimeString();
}
setInterval(updateBanner, 1000);

// Calculator
function calculateTotal() {
    let price = parseFloat(document.getElementById("price").value);
    let quantity = parseInt(document.getElementById("quantity").value);
    let age = parseInt(document.getElementById("age").value);

    if (isNaN(price) || isNaN(quantity) || isNaN(age)) {
        alert("Enter valid values");
        return;
    }

    let total = price * quantity;

    if (age > 60) {
        total *= 0.9;
    }

    document.getElementById("result").innerText = total.toFixed(2);
}
</script>
