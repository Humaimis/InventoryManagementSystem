                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">

        <div class="container mt-5">

            <h2>Categories</h2>

            <div class="mb-3">
                <input id="catName" class="form-control mb-2" placeholder="Category Name">
                <input id="desc" class="form-control mb-2" placeholder="Description">

                <button class="btn btn-success" onclick="addCategory()">Add Category</button>
            </div>

            <input id="searchCat" class="form-control mb-3" placeholder="Search..." onkeyup="searchCategory()">

            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id="categoryTable"></tbody>
            </table>

        </div>

        <div class="bg-dark text-white mt-5 p-2">
            <marquee id="bannerText"></marquee>
        </div>

        <footer class="bg-light text-center p-3 mt-4">
            <p>© 2026 Inventory Management System</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>

            // Constructor
            function Category(name, description) {
                this.name = name;
                this.description = description;
            }

            // Array
            let categories = [
                new Category("Electronics", "Devices and gadgets"),
                new Category("Furniture", "Home and office items")
            ];

            // Display
            function displayCategories(list) {
                let table = document.getElementById("categoryTable");
                table.innerHTML = "";

                list.forEach(c => {
                    table.innerHTML += `
                        <tr>
                            <td>${c.name}</td>
                            <td>${c.description}</td>
                        </tr>`;
                });
            }

            // Add
            function addCategory() {
                let name = document.getElementById("catName").value;
                let desc = document.getElementById("desc").value;

                if (!name || !desc) {
                    alert("Enter valid data");
                    return;
                }

                categories.push(new Category(name, desc));
                displayCategories(categories);
            }

            // Search
            function searchCategory() {
                let keyword = document.getElementById("searchCat").value.toLowerCase();

                let filtered = categories.filter(c =>
                    c.name.toLowerCase().includes(keyword)
                );

                displayCategories(filtered);
            }

            // Banner
            setInterval(() => {
                let now = new Date();
                document.getElementById("bannerText").innerText =
                    "Welcome! " + now.toLocaleDateString() + " " + now.toLocaleTimeString();
            }, 1000);

            // Initial load
            displayCategories(categories);

        </script>

    </body>
</html>
