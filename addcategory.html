    <div class="container mt-5">
        <h2>Add Category</h2>

        <div class="mb-3">
            <input id="catName" class="form-control mb-2" placeholder="Category Name">
            <input id="desc" class="form-control mb-2" placeholder="Description">

            <button class="btn btn-success" onclick="addCategory()">Add Category</button>
        </div>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Category Name</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody id="categoryTable"></tbody>
        </table>
    </div>

    <div class="bg-dark text-white mt-5 p-2"> 
        <marquee id="bannerText"></marquee> 
    </div> 
 
    <footer class="bg-light text-center p-3 mt-4"> 
        <p>© 2026 Inventory Management System</p> 
    </footer> 
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> 
    <script>
        // Category constructor
        function Category(name, description) {
            this.name = name;
            this.description = description;
        }

        // Array
        let categories = [];

        // Display function
        function displayCategories() {
            let table = document.getElementById("categoryTable");
            table.innerHTML = "";

            categories.forEach(c => {
                table.innerHTML += `
                <tr>
                    <td>${c.name}</td>
                    <td>${c.description}</td>
                </tr>`;
            });
        }

        // Add category
        function addCategory() {
            let name = document.getElementById("catName").value;
            let desc = document.getElementById("desc").value;

            if (!name || !desc) {
                alert("Enter valid data");
                return;
            }

            let newCategory = new Category(name, desc);
            categories.push(newCategory);

            displayCategories();
        }
    </script>
