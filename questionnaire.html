        </div>

<div class="container mt-5">
    <h2 class="text-center mb-4">Customer Feedback</h2>

    <form class="p-4 bg-light rounded shadow">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" id="name" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" id="email" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Rate our system</label><br>
            <input type="radio" name="rate"> Good
            <input type="radio" name="rate"> Average
            <input type="radio" name="rate"> Bad
        </div>

        <div class="mb-3">
            <label class="form-label">Features you like</label><br>
            <input type="checkbox"> Easy UI
            <input type="checkbox"> Fast
            <input type="checkbox"> Accurate
        </div>

        <div class="mb-3">
            <label class="form-label">Comments</label>
            <textarea id="comments" class="form-control"></textarea>
        </div>

        <button type="button" class="btn btn-primary" onclick="validateForm()">Submit</button>

    </form>
</div>

<div class="bg-dark text-white mt-5 p-2">
    <marquee id="bannerText"></marquee>
</div>

<footer class="bg-light text-center p-3">
    <p>© 2026 Inventory Management System</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Banner
function updateBanner() {
    let now = new Date();
    document.getElementById("bannerText").innerText =
        "Welcome! Today is " + now.toLocaleDateString() +
        " and time is " + now.toLocaleTimeString();
}
setInterval(updateBanner, 1000);

// Validation
function validateForm() {
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let comments = document.getElementById("comments").value;

    if (name.length < 3) {
        alert("Name must be at least 3 characters");
        return;
    }

    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if (!email.match(emailPattern)) {
        alert("Invalid email");
        return;
    }

    if (comments.length < 10) {
        alert("Comments must be at least 10 characters");
        return;
    }

    alert("Submitted successfully!");
}
</script>

</body>
