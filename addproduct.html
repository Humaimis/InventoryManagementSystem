    <div class="container mt-5">
        <h2>Add Product</h2>

        <div class="mb-3">
            <input id="name" class="form-control mb-2" placeholder="Product Name">
            <input id="price" class="form-control mb-2" placeholder="Price">
            <input id="qty" class="form-control mb-2" placeholder="Quantity">

            <button class="btn btn-success" onclick="addProduct()">Add Product</button>
        </div>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                </tr>
            </thead>
            <tbody id="productTable"></tbody>
        </table>
    </div>

    <div class="bg-dark text-white mt-5 p-2"> 
        <marquee id="bannerText"></marquee> 
    </div> 
 
    <footer class="bg-light text-center p-3 mt-4"> 
        <p>© 2026 Inventory Management System</p> 
    </footer> 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> 
    <script>
        // Product constructor
        function Product(name, price, quantity) {
            this.name = name;
            this.price = price;
            this.quantity = quantity;
        }

        // Array
        let products = [];

        // Display function
        function displayProducts() {
            let table = document.getElementById("productTable");
            table.innerHTML = "";

            products.forEach(p => {
                table.innerHTML += `
                <tr>
                    <td>${p.name}</td>
                    <td>${p.price}</td>
                    <td>${p.quantity}</td>
                </tr>`;
            });
        }

        // Add product
        function addProduct() {
            let name = document.getElementById("name").value;
            let price = parseFloat(document.getElementById("price").value);
            let qty = parseInt(document.getElementById("qty").value);

            if (!name || isNaN(price) || isNaN(qty)) {
                alert("Enter valid data");
                return;
            }

            let newProduct = new Product(name, price, qty);
            products.push(newProduct);

            displayProducts();
        }

        // Function to update banner with date and time 
        function updateBanner() { 
            let now = new Date(); 
 
            let date = now.toLocaleDateString(); 
            let time = now.toLocaleTimeString(); 
 
            document.getElementById("bannerText").innerText = 
                "Welcome to Inventory System! Today is " + date + " and time is " + time; 
        } 
 
        // Update every second 
        setInterval(updateBanner, 1000); 
    </script>
</body>
