    <div class="container mt-5">
        <h2>Inventory Reports</h2>

        <button class="btn btn-primary mb-3" onclick="generateReport()">Generate Report</button>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total Value</th>
                </tr>
            </thead>
            <tbody id="reportTable"></tbody>
        </table>

        <h4 id="grandTotal"></h4>
    </div>
    <div class="bg-dark text-white mt-5 p-2"> 
        <marquee id="bannerText"></marquee> 
    </div> 
 
    <footer class="bg-light text-center p-3 mt-4"> 
        <p>© 2026 Inventory Management System</p> 
    </footer> 
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> 
    <script>
        // Product constructor
        function Product(name, price, quantity) {
            this.name = name;
            this.price = price;
            this.quantity = quantity;
        }

        // Sample data
        let products = [
            new Product("Laptop", 500, 10),
            new Product("Phone", 300, 20),
            new Product("Tablet", 200, 15)
        ];

        //Function to generate areport about products
        function generateReport() {

            let table = document.getElementById("reportTable");
            table.innerHTML = "";

            let total = 0;

            products.forEach(p => {

                let value = p.price * p.quantity;     //counting logic
                total += value;

                table.innerHTML += `
                <tr>
                    <td>${p.name}</td>
                    <td>${p.price}</td>
                    <td>${p.quantity}</td>
                    <td>${value}</td>
                </tr>`;
            });

            //Print the total
            document.getElementById("grandTotal").innerText =
                "Total Inventory Value: " + total;
        }

        //Function to update banner with date and time 
        function updateBanner() { 
            let now = new Date(); 
 
            let date = now.toLocaleDateString(); 
            let time = now.toLocaleTimeString(); 
 
            document.getElementById("bannerText").innerText = 
                "Welcome to Inventory System! Today is " + date + " and time is " + time; 
        } 
 
        // Update every second 
        setInterval(updateBanner, 1000); 
    </script>
</body>
